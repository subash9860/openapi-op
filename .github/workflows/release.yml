name: release

on:
  push:
    branches: [main]

# Pushes made with GITHUB_TOKEN do not re-trigger workflows, so the release
# commit this job creates cannot loop back into another run.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release commit + tag, create the Release
      id-token: write        # npm trusted publishing (OIDC), exempt from 2FA
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # changelog needs history + tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with an empty _authToken,
          # which blocks the OIDC exchange used by trusted publishing.
      - run: npm ci
      - run: npm test

      - name: Bump version + changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A rerun checks out the SHA that triggered the run, so move to the
          # current main first — otherwise the bump recomputes a version the
          # failed attempt already tagged.
          git fetch origin main --tags
          git reset --hard origin/main
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          log=$(git log ${last:+$last..}HEAD --no-merges --pretty=format:%s%n%b)
          if grep -qE '^feat(\(.+\))?!?:|BREAKING CHANGE' <<<"$log"; then bump=minor; else bump=patch; fi
          npm version "$bump" -m "chore: release v%s"
          git push --follow-tags

      - run: |
          echo "oidc_url=${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "npmrc=${NPM_CONFIG_USERCONFIG:-none}"
          npm config get userconfig
      - run: npm publish --loglevel verbose
      - run: gh release create "v$(node -p 'require("./package.json").version')" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
